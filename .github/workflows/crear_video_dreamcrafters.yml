name: Crear y Publicar Reel DreamCrafters

on:
  workflow_dispatch:
    inputs:
      character:
        description: 'Personaje presentador (02_mario)'
        type: choice
        options:
          - 02_mario
        default: 02_mario
      publish:
        description: 'Publicar automáticamente en Facebook e Instagram Reels'
        type: boolean
        default: false
  schedule:
    - cron: '0 16 * * *'  # 10:00 AM CDMX
    - cron: '0 23 * * *'  # 05:00 PM CDMX

concurrency:
  group: dreamcrafters-video-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      META_GRAPH_VERSION: 'v21.0'
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Caché de pesos locales Chatterbox Multilingual TTS (~2.1 GB)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            characters/02_mario/out/cloned_voice_cache
          key: chatterbox-mtl-v1-${{ hashFiles('render_dreamcrafters_video.py') }}
          restore-keys: |
            chatterbox-mtl-v1-

      - name: Instalar FFmpeg, Rhubarb Lip-Sync, Playwright y Chatterbox TTS Local
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip curl fonts-dejavu-core fonts-liberation
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-deps chatterbox-tts
          pip install opencv-python-headless numpy pillow playwright librosa s3tokenizer resemble-perth conformer==0.3.2 safetensors pyloudnorm omegaconf pykakasi==2.3.0 diffusers==0.29.0 transformers huggingface-hub
          playwright install --with-deps chromium
          curl -fsSL https://github.com/DanielSWolf/rhubarb-lip-sync/releases/download/v1.13.0/Rhubarb-Lip-Sync-1.13.0-Linux.zip -o /tmp/rhubarb.zip
          sudo unzip -q /tmp/rhubarb.zip -d /opt/rhubarb
          sudo ln -sf /opt/rhubarb/Rhubarb-Lip-Sync-1.13.0-Linux/rhubarb /usr/local/bin/rhubarb
          npm install

      - name: Validar configuración de publicación Meta
        if: github.event_name == 'schedule' || inputs.publish
        run: node publish_video.js --check-config

      - name: Capturar Invitación Real en Modo Celular (Playwright Chromium)
        run: python capture_real_mario_mobile.py

      - name: Clonar Voz Localmente (Chatterbox TTS) y Renderizar Video con Toon Maker
        run: |
          mkdir -p out
          python render_dreamcrafters_video.py --output out/video_final_dreamcrafters.mp4

      - name: Publicar Reel en Facebook e Instagram de DreamCrafters
        if: github.event_name == 'schedule' || inputs.publish
        run: node publish_video.js

      - name: Subir Video Renderizado como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcrafters-reel-${{ github.run_id }}
          retention-days: 14
          path: |
            out/video_final_dreamcrafters.mp4
            out/publication-state.json
