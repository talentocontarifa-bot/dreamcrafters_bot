name: Publicar Reel DreamCrafters

on:
  workflow_dispatch:
    inputs:
      video_file:
        description: 'Archivo MP4 en videos/ (o "auto" para rotación automática)'
        type: string
        default: 'auto'
      publish:
        description: 'Publicar en redes sociales (FB, IG, TikTok, YouTube Shorts)'
        type: boolean
        default: true
  schedule:
    - cron: '30 16 * * *' # 10:30 AM CDMX (Turno 1 de 3 — desfasado de TCT y PET)
    - cron: '30 21 * * *' # 03:30 PM CDMX (Turno 2 de 3 — desfasado de TCT y PET)
    - cron: '30 2 * * *'  # 08:30 PM CDMX (Turno 3 de 3 — desfasado de TCT y PET)

concurrency:
  group: dreamcrafters-video-publication
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIDEO_PATH: ${{ inputs.video_file || 'auto' }}
      META_GRAPH_VERSION: 'v21.0'
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
      TCT_META_PAGE_ID: ${{ secrets.TCT_META_PAGE_ID }}
      TCT_META_PAGE_ACCESS_TOKEN: ${{ secrets.TCT_META_PAGE_ACCESS_TOKEN }}
      TCT_INSTAGRAM_ACCOUNT_ID: ${{ secrets.TCT_INSTAGRAM_ACCOUNT_ID }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'public' }}
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias del publicador
        run: npm ci

      - name: Validar configuración de publicación
        run: node publish_video.js --check-config

      - name: Publicar Reel desde bandeja videos/
        if: github.event_name == 'schedule' || inputs.publish
        run: node publish_video.js

      - name: Subir reporte de publicación como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamcrafters-publication-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            out/publication-state.json
